services:
  postgres:
    image: postgres:16-alpine
    container_name: tgzh-postgres
    restart: always
    ports:
      - "127.0.0.1:15432:5432"
    networks:
      - tgzh-internal
    environment:
      # Креды и имя БД берутся из .env (см. .env.example: POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB).
      # Фоллбэки tgzh/tgzh/tgzh оставлены для локальной dev-среды; в проде задавай явно
      # и держи такие же значения в DATABASE_URL.
      POSTGRES_USER: ${POSTGRES_USER:-tgzh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tgzh}
      POSTGRES_DB: ${POSTGRES_DB:-tgzh}
    volumes:
      - tgzh-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tgzh} -d ${POSTGRES_DB:-tgzh}"]
      interval: 5s
      timeout: 3s
      retries: 5

  tgzh-server:
    build:
      context: .
      dockerfile: Dockerfile.server
      network: host
    image: tgzh-server:latest
    container_name: tgzh-server
    restart: always
    networks:
      - tgzh-internal
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # При активном профиле preocr сервер стартует после pre-OCR (имя хоста tgzh-preocr из PREOCR_URL).
    # Ждём именно service_healthy, чтобы /check не падал по таймауту, пока модели прогреваются.
    depends_on:
      tgzh-preocr:
        condition: service_healthy
        required: false

  # Опционально: docker compose --profile preocr up -d --build (см. README). В .env: PREOCR_URL=http://tgzh-preocr:8088
  # По умолчанию сборка CPU (Dockerfile.preocr) — работает на любой машине, без CUDA.
  # Для GPU: создай docker-compose.override.yml с PREOCR_DOCKERFILE=Dockerfile.preocr.gpu
  # и блоком gpus: all (см. README). PaddlePaddle 3.2.2 поддерживает sm_75…90; на sm_120 (Blackwell) — пока CPU.
  tgzh-preocr:
    profiles:
      - preocr
    build:
      context: .
      dockerfile: ${PREOCR_DOCKERFILE:-Dockerfile.preocr}
      network: host
      args:
        PADDLE_GPU_IMAGE: ${PADDLE_GPU_IMAGE:-paddlepaddle/paddle:3.2.2-gpu-cuda12.6-cudnn9.5}
    image: tgzh-preocr:latest
    container_name: tgzh-preocr
    restart: always
    networks:
      - tgzh-internal
    ports:
      - "127.0.0.1:8088:8088"
    env_file:
      - .env
    volumes:
      - tgzh-preocr-models:/root/.paddlex
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  tgzh-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
      network: host
    image: tgzh-bot:latest
    container_name: tgzh-bot
    restart: always
    networks:
      - tgzh-internal
    env_file:
      - .env
    environment:
      # Поверх .env: в рантайме контейнеры в сети compose (имя сервиса tgzh-server), не на host; 127.0.0.1 в боте — это сам контейнер
      SERVER_URL: http://tgzh-server:8000
      GDZ_CATALOG_PATH: /app/static/gdz_matematika_textbooks.json
      GDZ_CACHE_DIR: /app/data/gdz_cache
      # Граница учебного года для статистики (сентябрь — август). Берём из .env (STATS_TIMEZONE);
      # дефолт оставлен Europe/Moscow и совпадает с .env.example / README.
      STATS_TIMEZONE: ${STATS_TIMEZONE:-Europe/Moscow}
    volumes:
      # Именованный том: SQLite (профили, статистика) и кеш GDZ переживают удаление контейнера.
      # Не используй docker compose down -v, если нужны данные.
      # Альтернатива — каталог на хосте, например: - ./data:/app/data
      - tgzh-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      tgzh-server:
        condition: service_healthy
    # PostgreSQL: DATABASE_URL в .env (например postgresql://tgzh:tgzh@postgres:5432/tgzh). USER_DB_PATH в compose не задаем — иначе перекрывает смысл Postgres

networks:
  tgzh-internal:
    driver: bridge

volumes:
  tgzh-data:
  tgzh-pg:
  tgzh-preocr-models:

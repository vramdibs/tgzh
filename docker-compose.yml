services:
  postgres:
    image: postgres:16-alpine
    container_name: tgzh-postgres
    restart: always
    ports:
      - "127.0.0.1:15432:5432"
    networks:
      - tgzh-internal
    environment:
      # Креды и имя БД берутся из .env (см. .env.example: POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB).
      # Фоллбэки tgzh/tgzh/tgzh оставлены для локальной dev-среды; в проде задавай явно
      # и держи такие же значения в DATABASE_URL.
      POSTGRES_USER: ${POSTGRES_USER:-tgzh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tgzh}
      POSTGRES_DB: ${POSTGRES_DB:-tgzh}
    volumes:
      - tgzh-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tgzh} -d ${POSTGRES_DB:-tgzh}"]
      interval: 5s
      timeout: 3s
      retries: 5

  tgzh-server:
    build:
      context: .
      dockerfile: Dockerfile.server
      network: host
    image: tgzh-server:latest
    container_name: tgzh-server
    restart: always
    networks:
      - tgzh-internal
    ports:
      - "127.0.0.1:8000:8000"
      - "${TGZH_METRICS_BIND:-127.0.0.1}:9112:9112"
    # host-gateway даёт `host.docker.internal` -> хост-машина. Нужно для
    # VLLM_FALLBACK_BASE_URL на локальный bridge (см. .env, блок VLLM_FALLBACK_*).
    # Когда bridge станет доступен публично через cloudflared tunnel, эту запись
    # можно безопасно удалить вместе с переключением URL обратно.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      # JWT от motok hub на POST /check (тот же секрет, что MOTOK_HUB_TOKEN_SECRET в хабе).
      MOTOK_HUB_TOKEN_SECRET: ${MOTOK_HUB_TOKEN_SECRET:-}
      # LM Studio на хосте (перекрывает .env при export перед compose up).
      AI_MOCK: ${AI_MOCK:-0}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:1234/v1}
      VLLM_MODEL: ${VLLM_MODEL:-}
      VLLM_VISION: ${VLLM_VISION:-0}
      VLLM_API_KEY: ${VLLM_API_KEY:-lm-studio}
      VLLM_NO_THINK: ${VLLM_NO_THINK:-1}
      METRICS_PORT: ${SERVER_METRICS_PORT:-9112}
      METRICS_BIND: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # При активном профиле preocr сервер стартует после pre-OCR (имя хоста tgzh-preocr из PREOCR_URL).
    # Ждём именно service_healthy, чтобы /check не падал по таймауту, пока модели прогреваются.
    depends_on:
      tgzh-preocr:
        condition: service_healthy
        required: false

  # Опционально: docker compose --profile preocr up -d --build (см. README). В .env: PREOCR_URL=http://tgzh-preocr:8088
  # По умолчанию сборка CPU (Dockerfile.preocr) — работает на любой машине, без CUDA.
  # Для GPU: создай docker-compose.override.yml с PREOCR_DOCKERFILE=Dockerfile.preocr.gpu
  # и блоком gpus: all (см. README). PaddlePaddle 3.2.2 поддерживает sm_75…90; на sm_120 (Blackwell) — пока CPU.
  tgzh-preocr:
    profiles:
      - preocr
    build:
      context: .
      dockerfile: ${PREOCR_DOCKERFILE:-Dockerfile.preocr}
      network: host
      args:
        PADDLE_GPU_IMAGE: ${PADDLE_GPU_IMAGE:-paddlepaddle/paddle:3.2.2-gpu-cuda12.6-cudnn9.5}
    image: tgzh-preocr:latest
    container_name: tgzh-preocr
    restart: always
    networks:
      - tgzh-internal
    ports:
      - "127.0.0.1:8088:8088"
    env_file:
      - .env
    volumes:
      - tgzh-preocr-models:/root/.paddlex
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # Whisper STT (Speech-To-Text) для голосовых сообщений в /chat.
  # OpenAI-совместимый POST /v1/audio/transcriptions (faster-whisper). Бот ходит сюда
  # из контейнера через имя сервиса tgzh-stt:9000 (см. .env: STT_BASE_URL).
  # Карта sm_120 (Blackwell, RTX 5060 Ti) — используем CPU (как и tgzh-preocr); int8
  # на 4 потоках укладывается в ~1.5 ГБ RAM с моделью small.
  # Порт хоста 127.0.0.1:9110 — только для локальной отладки (curl /v1/models).
  # 9100 занят node_exporter на хосте.
  # Модели кэшируются в томе tgzh-stt-models (на первом старте качается ~465 МБ).
  tgzh-stt:
    image: hwdsl2/whisper-server:latest
    container_name: tgzh-stt
    restart: always
    networks:
      - tgzh-internal
    ports:
      - "127.0.0.1:9110:9000"
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ru}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
      WHISPER_BEAM: ${WHISPER_BEAM:-1}
      WHISPER_LOG_LEVEL: ${WHISPER_LOG_LEVEL:-INFO}
      # API key из тома (manage.sh --getkey); STT_API_KEY в боте должен совпадать.
      WHISPER_API_KEY: ${STT_API_KEY:-}
    volumes:
      - tgzh-stt-models:/var/lib/whisper
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os,urllib.request,sys; k=os.environ.get('WHISPER_API_KEY',''); h={'Authorization':'Bearer '+k} if k else {}; r=urllib.request.Request('http://127.0.0.1:9000/v1/models', headers=h); sys.exit(0 if urllib.request.urlopen(r, timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 180s

  tgzh-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
      network: host
    image: tgzh-bot:latest
    container_name: tgzh-bot
    restart: always
    networks:
      - tgzh-internal
    # См. tgzh-server: host.docker.internal нужен fallback'у в ai_checker.py.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      # Поверх .env: в рантайме контейнеры в сети compose (имя сервиса tgzh-server), не на host; 127.0.0.1 в боте — это сам контейнер
      # Жёстко tgzh-server: .env SERVER_URL не должен перекрывать compose-сеть (см. .env.example).
      SERVER_URL: http://tgzh-server:8000
      # motok hub: только если задан в .env (пустой MOTOK_HUB_URL — проверка ДЗ без JWT/person_id).
      # Для хаба на хосте Docker: MOTOK_HUB_URL=http://host.docker.internal:54326 (не 127.0.0.1 — в контейнере это loopback).
      MOTOK_HUB_URL: ${MOTOK_HUB_URL:-}
      MOTOK_INTERNAL_TOKEN: ${MOTOK_INTERNAL_TOKEN:-}
      MOTOK_HUB_TOKEN_SECRET: ${MOTOK_HUB_TOKEN_SECRET:-}
      GDZ_CATALOG_PATH: /app/static/gdz_catalog.json
      GDZ_CACHE_DIR: /app/data/gdz_cache
      # Граница учебного года для статистики (сентябрь — август). Берём из .env (STATS_TIMEZONE);
      # дефолт оставлен Europe/Moscow и совпадает с .env.example / README.
      STATS_TIMEZONE: ${STATS_TIMEZONE:-Europe/Moscow}
      TELEGRAM_WEBHOOK_LISTEN: 0.0.0.0
      TELEGRAM_WEBHOOK_PORT: ${TELEGRAM_WEBHOOK_PORT:-8081}
      METRICS_PORT: ${METRICS_PORT:-9109}
      METRICS_BIND: 0.0.0.0
    ports:
      - "${TGZH_WEBHOOK_BIND:-0.0.0.0}:8081:8081"
      - "${TGZH_METRICS_BIND:-127.0.0.1}:9109:9109"
    volumes:
      # Именованный том: SQLite (профили, статистика) и кеш GDZ переживают удаление контейнера.
      # Не используй docker compose down -v, если нужны данные.
      # Альтернатива — каталог на хосте, например: - ./data:/app/data
      - tgzh-data:/app/data
      # Каталог учебников с хоста — после fetch_gdz_textbooks.py достаточно restart бота.
      - ./data/gdz_catalog.json:/app/static/gdz_catalog.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      tgzh-server:
        condition: service_healthy
      # tgzh-stt не блокирует старт бота: голосовые без STT просто отвечают «не настроено»,
      # а первый старт STT качает модель и может занять 1-3 минуты.
      tgzh-stt:
        condition: service_started
    # PostgreSQL: DATABASE_URL в .env (например postgresql://tgzh:tgzh@postgres:5432/tgzh). USER_DB_PATH в compose не задаем — иначе перекрывает смысл Postgres

networks:
  tgzh-internal:
    driver: bridge

volumes:
  tgzh-data:
  tgzh-pg:
  tgzh-preocr-models:
  tgzh-stt-models:
